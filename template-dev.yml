Transform: AWS::Serverless-2016-10-31
Description: Dev | ABA Schedules Optimizer.
Parameters:
  StageName:
    Type: String
    Default: Dev

Resources:
  HttpApi:
    Type: 'AWS::Serverless::HttpApi'
    Properties:
      StageName: Dev
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowHeaders:
          - 'Content-Type'
        AllowMethods:
          - 'OPTIONS'
          - 'GET'
          - 'POST'
          - 'PUT'
          - 'DELETE'

  OptimizerLambdaFunctionDev:
    Type: 'AWS::Serverless::Function'
    Properties:
      FunctionName: OptimizerLambdaHandlerFunctionDev
      PackageType: Image
      ImageUri: optimizerlambdahandlerfunctiondev:latest
      Timeout: 900
      MemorySize: 10240
      Environment:
        Variables:
          BACKEND_URL: https://beta-api.abaschedules.com/api
          EC2_START_FUNCTION_URL: "https://epg2a42bw5rmzf7dzohfcrd3oa0ncmxu.lambda-url.us-east-1.on.aws" # EC2MakeStartBeta
      Events:
        RootRoute:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /
            Method: get
        PostAutomation:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /automation
            Method: post
        PostSolutionGenerator:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /solution_generator
            Method: post

    Metadata:
      Dockerfile: Dockerfile_solutionGenerator.dev
      DockerContext: .

Outputs:
  HttpApiUrl:
    Description: URL of your API endpoint
    Value:
      Fn::Sub: 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}/'
