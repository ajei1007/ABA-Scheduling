Transform: AWS::Serverless-2016-10-31
Description: Beta | ABA Schedules Optimizer.
Parameters:
  StageName:
    Type: String
    Default: beta

Resources:
  HttpApi:
    Type: 'AWS::Serverless::HttpApi'
    Properties:
      StageName: beta
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowHeaders:
          - 'Content-Type'
        AllowMethods:
          - 'OPTIONS'
          - 'GET'
          - 'POST'
          - 'PUT'
          - 'DELETE'

  OptimizerLambdaFunctionBeta:
    Type: 'AWS::Serverless::Function'
    Properties:
      FunctionName: OptimizerLambdaHandlerFunctionBeta
      PackageType: Image
      ImageUri: optimizerlambdafunctionbeta:latest
      Timeout: 900
      MemorySize: 10240
      Environment:
        Variables:
          BACKEND_URL: https://production-api.abaschedules.com/api
          EC2_START_FUNCTION_URL: "https://ihwpbnjt2syrzqtvlgrndo5qpi0sxeqa.lambda-url.us-east-1.on.aws" # EC2MakeStart (i.e. prod / legacy)
      Events:
        RootRoute:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /
            Method: get
        PostAutomation:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /automation
            Method: post
        PostSolutionGenerator:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /solution_generator
            Method: post

    Metadata:
      Dockerfile: Dockerfile_solutionGenerator.dev
      DockerContext: .

Outputs:
  HttpApiUrl:
    Description: URL of your API endpoint
    Value:
      Fn::Sub: 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}/'
